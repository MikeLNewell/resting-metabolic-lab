name: Unpack website
on:
  push:
    paths:
      - 'site-payload.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website files
        run: |
          base64 --decode site-payload.txt > /tmp/website.zip
          unzip -q -o /tmp/website.zip -d /tmp/website
          cp -a /tmp/website/the-metabolic-lab/. .
          rm -f site-payload.txt
      - name: Validate calculations
        run: node tests/science.test.mjs
      - name: Commit website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish metabolic laboratory site" || exit 0
          git push