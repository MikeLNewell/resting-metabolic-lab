name: Unpack website
on:
  push:
    paths:
      - 'payload/part-8.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract full site archive
        run: |
          cat payload/part-{1..8}.txt | base64 --decode > /tmp/website.tar.xz
          tar -xJf /tmp/website.tar.xz
          rm -rf payload
      - name: Validate calculations
        run: node tests/science.test.mjs
      - name: Commit website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish metabolic laboratory site" || exit 0
          git push